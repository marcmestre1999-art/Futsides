<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Reunión abogado</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f3d22'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23d4af37' font-family='Arial' font-weight='bold'%3E§%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#17201a;--mute:#5e6a61;--line:#e3ded2;--accent:#0f3d22;--gold:#b8902a;--fill:#fff4c2;--fillink:#6b5200;--warnbg:#fdeceb;--warnink:#8a1f17;--r3:#c0392b;--r2:#d68910;--r1:#5d8a5f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1411;--card:#18201b;--ink:#e9ede8;--mute:#9aa79d;--line:#2a352d;--accent:#7fc59a;--gold:#d4af37;--fill:#3a3212;--fillink:#f1d77a;--warnbg:#3a1714;--warnink:#f2a59d;--r3:#ef6a5b;--r2:#f0a83a;--r1:#86b889;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1411;--card:#18201b;--ink:#e9ede8;--mute:#9aa79d;--line:#2a352d;--accent:#7fc59a;--gold:#d4af37;--fill:#3a3212;--fillink:#f1d77a;--warnbg:#3a1714;--warnink:#f2a59d;--r3:#ef6a5b;--r2:#f0a83a;--r1:#86b889;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:0 16px 64px}
a{color:var(--accent)}
.top{padding:28px 0 8px}
.kicker{margin:0;color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
h1{margin:4px 0 6px;font-size:28px;line-height:1.15}
.sub{margin:0 0 14px;color:var(--mute);font-size:15px}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;margin:0 -16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:0 0 auto;text-decoration:none;font-size:14px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:16px 0;scroll-margin-top:64px}
.card h2{margin:0 0 8px;font-size:21px}
.card h3{margin:20px 0 6px;font-size:16px;color:var(--accent)}
.card p{margin:0 0 10px}
.hero{border-left:5px solid var(--gold)}
.hint{color:var(--mute);font-size:14px}
.warn{background:var(--warnbg);color:var(--warnink);padding:10px 12px;border-radius:10px}
.fill{background:var(--fill);color:var(--fillink);border-radius:6px;padding:1px 6px}
dl.facts{margin:0;display:grid;grid-template-columns:1fr;gap:2px}
dl.facts dt{font-size:13px;color:var(--mute);margin-top:10px;font-weight:600}
dl.facts dd{margin:0}
dl.facts dd.fill{display:block;padding:6px 8px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 12px 72px;min-height:24px}
.timeline li span{position:absolute;left:0;top:1px;font-size:13px;font-weight:700;color:var(--gold);width:64px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--mute);font-weight:400}
details[open] summary::after{content:"–"}
details p,details ul{margin:8px 0 0}
details ul{padding-left:18px}
details li{margin-bottom:6px}
.r3,.r2,.r1{font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;color:#fff;flex:0 0 auto}
.r3{background:var(--r3)}.r2{background:var(--r2)}.r1{background:var(--r1)}
ol.qs{list-style:none;padding:0;margin:0;counter-reset:q}
ol.qs li{counter-increment:q;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;margin:8px 0;position:relative}
ol.qs li .q{cursor:pointer;display:block}
ol.qs li::before{content:"";position:absolute;left:12px;top:12px;width:20px;height:20px;border-radius:6px;border:2px solid var(--mute)}
ol.qs li.done::before{background:var(--accent);border-color:var(--accent)}
ol.qs li.done::after{content:"✓";position:absolute;left:16px;top:10px;color:var(--card);font-weight:900;font-size:15px}
ol.qs li.done .q{color:var(--mute)}
ol.qs textarea{margin-top:8px;min-height:44px}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
button{font:inherit;font-weight:700;margin-top:10px;width:100%;padding:13px;border-radius:10px;border:0;background:var(--accent);color:var(--card);cursor:pointer}
.opt{border-left:3px solid var(--gold);padding:6px 0 6px 12px;margin:10px 0}
ul.checks{list-style:none;padding:0}
ul.checks li{padding:8px 0 8px 32px;position:relative;cursor:pointer;border-bottom:1px solid var(--line)}
ul.checks li::before{content:"";position:absolute;left:0;top:10px;width:18px;height:18px;border-radius:5px;border:2px solid var(--mute)}
ul.checks li.done::before{background:var(--accent);border-color:var(--accent)}
ul.checks li.done{color:var(--mute);text-decoration:line-through}
.small{font-size:14px}
.small ul{padding-left:18px}
.src li{margin-bottom:4px;word-break:break-word}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center}
#lock h1{font-size:22px}
#lock input{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
#lock .err{color:var(--warnink);min-height:20px;font-size:14px;margin:8px 0 0}
#lock label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--mute);margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="lock">
  <form id="f" autocomplete="off">
    <p class="kicker">Futsides</p>
    <h1>Reunión con el abogado</h1>
    <p class="hint">Escribe la contraseña que te ha pasado Marc.</p>
    <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Contraseña">
    <label><input id="rec" type="checkbox" checked style="width:auto"> Recordar en este móvil</label>
    <button type="submit">Abrir</button>
    <p class="err" id="err"></p>
  </form>
</div>
<main id="app" hidden></main>
<div class="toast" id="toast"></div>

(function(){
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function del(k){try{localStorage.removeItem(k)}catch(e){}}
  async function open(pw){
    var raw=b64(DATA),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    var key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},key,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,ct);
    return new TextDecoder().decode(pt);
  }
  async function tryOpen(pw,remember){
    try{
      var html=await open(pw);
      if(remember)put("fs-abg-pw",pw);
      document.getElementById("lock").remove();
      var app=document.getElementById("app");app.innerHTML=html;app.hidden=false;wire();
      return true;
    }catch(e){return false}
  }
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault();
    var ok=await tryOpen(document.getElementById("pw").value.trim(),document.getElementById("rec").checked);
    if(!ok)document.getElementById("err").textContent="Contraseña incorrecta";
  });
  var saved=get("fs-abg-pw");
  if(saved)tryOpen(saved,false).then(function(ok){if(!ok)del("fs-abg-pw")});

  function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},1600)}
  function wire(){
    var st={};try{st=JSON.parse(get("fs-abg-state")||"{}")}catch(e){st={}}
    function save(){put("fs-abg-state",JSON.stringify(st))}
    document.querySelectorAll("ol.qs").forEach(function(ol){
      var g=ol.getAttribute("data-group");
      ol.querySelectorAll("li").forEach(function(li,i){
        var id=g+"-"+i,txt=li.innerHTML;
        li.innerHTML='<span class="q">'+txt+'</span><textarea rows="1" placeholder="Respuesta…"></textarea>';
        var ta=li.querySelector("textarea");
        if(st[id+"-d"])li.classList.add("done");
        if(st[id+"-t"])ta.value=st[id+"-t"];
        li.querySelector(".q").addEventListener("click",function(){li.classList.toggle("done");st[id+"-d"]=li.classList.contains("done");save()});
        ta.addEventListener("input",function(){st[id+"-t"]=ta.value;if(ta.value&&!li.classList.contains("done")){li.classList.add("done");st[id+"-d"]=true}save()});
      });
    });
    document.querySelectorAll("ul.checks li").forEach(function(li,i){
      var id="chk-"+i;if(st[id])li.classList.add("done");
      li.addEventListener("click",function(){li.classList.toggle("done");st[id]=li.classList.contains("done");save()});
    });
    var n=document.getElementById("notas-libres");
    if(st.notas)n.value=st.notas;
    n.addEventListener("input",function(){st.notas=n.value;save()});
    document.getElementById("copiar").addEventListener("click",function(){
      var out=["REUNIÓN ABOGADO FUTSIDES"];
      document.querySelectorAll("ol.qs li").forEach(function(li){
        var t=li.querySelector("textarea").value.trim();
        if(t)out.push("• "+li.querySelector(".q").textContent.trim()+"\n  → "+t);
      });
      if(n.value.trim())out.push("\nNOTAS:\n"+n.value.trim());
      var s=out.join("\n");
      (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast("Copiado")},function(){
        var t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Copiado")}catch(e){}t.remove();
      });
    });
  }
})();
</script>
